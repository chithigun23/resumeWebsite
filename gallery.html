<!DOCTYPE html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Chithi Gunatilake</title>
<meta name="description" content="Photos of builds, boards and race weekends by Chithi Gunatilake.">
<meta name="theme-color" content="#F4F5F6">
<link rel="canonical" href="https://chithigunatilake.com/gallery">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chithigunatilake.com/gallery">
<meta property="og:title" content="Gallery — Chithi Gunatilake">
<meta property="og:description" content="Photos of builds, boards and race weekends by Chithi Gunatilake.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gallery.css">

<script>
  (function () {
    document.documentElement.classList.add("js");
    try {
      var saved = localStorage.getItem("cg-theme");
      var dark = saved ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) {}
  })();
</script>
</head>
<body class="gallery-page">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 .9v1.8M8 13.3v1.8M15.1 8h-1.8M2.7 8H.9M13 3l-1.3 1.3M4.3 11.7 3 13M13 13l-1.3-1.3M4.3 4.3 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13.6 9.9A6 6 0 0 1 6.1 2.4a6 6 0 1 0 7.5 7.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="rail">
  <a class="monogram" href="/" title="Back to resume">CG</a>
  <div class="rail-actions">
    <a class="chip-btn" href="/"><svg aria-hidden="true"><use href="#i-back"/></svg><span class="lbl">Resume</span></a>
    <button class="chip-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
      <svg aria-hidden="true" id="themeIcon"><use href="#i-moon"/></svg>
    </button>
  </div>
</div>

<main class="g-main">
  <header class="g-head">
    <h1 class="tag">Gallery</h1>
    <p class="g-count mono" id="count" aria-live="polite">Loading…</p>
  </header>

  <div class="g-grid" id="grid"></div>
  <p class="g-empty" id="empty" hidden>No photos yet. Add images to the <code>gallery/</code> folder and run <code>update-gallery.ps1</code>.</p>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Previous image">&#8249;</button>
  <figure class="lb-fig">
    <img id="lbImg" alt="">
    <figcaption class="mono" id="lbCap"></figcaption>
  </figure>
  <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Next image">&#8250;</button>
</div>

<script src="gallery.js"></script>
</body>
</html>
